[project]
name = "crt-traps"
version = "0.1.0"
description = "Do LLMs reason more on CRT traps? Items, run logs, analysis and report"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Daniel Menzel" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=1.26.4",
    "openai>=3.49.0",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
crt = "harness.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pikepdf>=10.18.2",
    "pytest>=9.2.0",
]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "harness"
